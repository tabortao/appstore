services:
  jotty:
    image: ghcr.io/fccview/jotty:latest
    container_name: ${CONTAINER_NAME}
    restart: always
    networks:
      - 1panel-network
    user: "1000:1000"
    ports:
      - "${PANEL_APP_PORT_HTTP}:3000"
    volumes:
      - "./data:/app/data:rw"
      - "./config:/app/config:rw"
      - "./cache:/app/.next/cache:rw"
    environment:
      - NODE_ENV=production
    labels:  
      createdBy: "Apps"

networks:  
  1panel-network:  
    external: true
